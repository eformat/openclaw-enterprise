apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oce-openshell-workspace-writer
rules:
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles]
    resourceNames: [openshell-workspace-sandbox]
    verbs: [bind, escalate]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [get, list, create, patch, delete]
  # The workspace Role the operator applies grants these to the sandbox
  # identity; the creating identity must hold them or the Kubernetes
  # role-escalation guard rejects the Role create.
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [agents.x-k8s.io]
    resources: [sandboxes, sandboxes/status]
    verbs: [get, list, watch, create, update, patch, delete]
